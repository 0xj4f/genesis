name: PR Build Check

on:
  pull_request:
    branches: [main, master]

jobs:
  security-tests:
    name: Security and Concurrency Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: isolated_test_password
          MYSQL_DATABASE: genesis_security
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      GENESIS_TEST_DATABASE_URL: mysql+pymysql://root:isolated_test_password@127.0.0.1:3306/genesis_security
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install --upgrade 'pip>=26.2'
      - run: pip install -r requirements-dev.lock
      - run: python -m pytest tests/security -q

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build genesis API
        run: docker build -f Dockerfile -t 0xj4f/genesis:pr-test .

  build-web:
    name: Build Web Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build genesis-web
        run: docker build -f web/Dockerfile -t 0xj4f/genesis-web:pr-test ./web

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build-api, build-web]
    steps:
      - uses: actions/checkout@v4

      - name: Build & start stack
        run: |
          docker compose -f docker-compose.yml build
          RATE_LIMIT_PER_SECOND=1000 AUTH_RATE_LIMIT_PER_MINUTE=1000 docker compose -f docker-compose.yml up -d
          sleep 15

      - name: Health check
        run: |
          curl -sf http://localhost:8001/health
          curl -sf http://localhost:8082/

      - name: Run E2E tests
        run: |
          pip install requests
          python tests/test_e2e.py

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml down -v
