# Genesis IAM - Production Compose
#
# Usage:
#   TAG=0.2.0 docker compose -f docker-compose.prod.yml up -d
#
# Or with latest:
#   docker compose -f docker-compose.prod.yml up -d
#
# Set required secrets, HTTPS issuer/origins and allowed hosts before starting.
# See docs/security-hardening.md. Production ROOT passwords are never logged.

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-genesis}
      MYSQL_USER: ${DB_USER:-genesis_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: 0xj4f/genesis:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8001}:8000"
    environment:
      ENVIRONMENT: production
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS to your API hostname}
      BOOTSTRAP_ROOT_PASSWORD: ${BOOTSTRAP_ROOT_PASSWORD:?Set BOOTSTRAP_ROOT_PASSWORD}
      RATE_LIMIT_PER_SECOND: ${RATE_LIMIT_PER_SECOND:-30}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
      REFRESH_RATE_LIMIT_PER_MINUTE: ${REFRESH_RATE_LIMIT_PER_MINUTE:-60}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Database
      MYSQL_DEV_USER: ${DB_USER:-genesis_user}
      MYSQL_DEV_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DATABASE_HOST: db
      DATABASE_PORT: "3306"
      DATABASE_NAME: ${DB_NAME:-genesis}
      # JWT
      OAUTH_ISSUER: ${OAUTH_ISSUER:?Set OAUTH_ISSUER to your HTTPS API URL}
      OAUTH_ALGORITHM: RS256
      OAUTH_DEFAULT_AUDIENCE: ${OAUTH_AUDIENCE:-genesis-api}
      OAUTH_ACCESS_TOKEN_EXPIRE_MINUTES: ${TOKEN_TTL_MINUTES:-30}
      OAUTH_REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TTL_DAYS:-30}
      OAUTH_PRIVATE_KEY_PATH: ./secrets/dev-private.pem
      OAUTH_PUBLIC_KEY_PATH: ./secrets/dev-public.pem
      OAUTH_JWT_KID: ${JWT_KID:-genesis-1}
      # CORS
      CORS_ALLOW_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your HTTPS web origin}
      # Sessions
      MAX_CONCURRENT_SESSIONS: ${MAX_SESSIONS:-5}
      # SSO (set these to enable social login)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      # Storage
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: ./uploads
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - signing_keys:/app/secrets

  web:
    image: 0xj4f/genesis-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8082}:80"
    depends_on:
      - api

volumes:
  mysql_data:
  uploads:
  signing_keys:
